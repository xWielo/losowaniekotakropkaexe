<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Losowanie Kota</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
      padding: 2rem;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
    }

    .card {
      background: #16213e;
      border-radius: 1.5rem;
      padding: 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    #cat-img {
      width: 100%;
      border-radius: 1rem;
      object-fit: contain;
      max-height: 420px;
      display: none;
      background: #0f3460;
    }

    #placeholder {
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      border-radius: 1rem;
      background: #0f3460;
    }

    button {
      margin-top: 1.5rem;
      padding: 0.8rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 2rem;
      background: #e94560;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background: #c73652; }
    button:active { transform: scale(0.96); }
    button:disabled { background: #555; cursor: not-allowed; transform: none; }

    #status {
      margin-top: 0.8rem;
      font-size: 0.9rem;
      color: #aaa;
      min-height: 1.2rem;
    }

    #nazwa {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #666;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>🐱 Losowanie Kota</h1>
  <div class="card">
    <div id="placeholder">🐱</div>
    <img id="cat-img" alt="Losowy kot" />
    <button id="btn" onclick="losujKota()">Losuj kota!</button>
    <div id="status"></div>
    <div id="nazwa"></div>
  </div>

  <script>
    const img = document.getElementById('cat-img');
    const placeholder = document.getElementById('placeholder');
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    const nazwa = document.getElementById('nazwa');

    let lista = [];

    async function wczytajListe() {
      try {
        const res = await fetch('koty/lista.json');
        if (!res.ok) throw new Error();
        lista = await res.json();
        if (lista.length === 0) throw new Error('pusta');
        status.textContent = `Znaleziono ${lista.length} kotów. Kliknij losuj!`;
      } catch {
        status.textContent = '⚠️ Brak koty/lista.json — uruchom generuj-liste.py';
        btn.disabled = true;
      }
    }

    function losujKota() {
      if (lista.length === 0) return;
      const plik = lista[Math.floor(Math.random() * lista.length)];

      btn.disabled = true;
      status.textContent = 'Losuję...';
      nazwa.textContent = '';

      img.onload = () => {
        placeholder.style.display = 'none';
        img.style.display = 'block';
        status.textContent = 'Oto twój kot! 🎉';
        nazwa.textContent = plik;
        btn.disabled = false;
      };
      img.onerror = () => {
        status.textContent = `Nie można załadować: ${plik}`;
        btn.disabled = false;
      };
      img.src = 'koty/' + encodeURIComponent(plik);
    }

    wczytajListe();
  </script>
</body>
</html>
