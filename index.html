<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Losowanie Kota</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
      padding: 2rem;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
    }

    .card {
      background: #16213e;
      border-radius: 1.5rem;
      padding: 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    #cat-img {
      width: 100%;
      border-radius: 1rem;
      min-height: 300px;
      object-fit: cover;
      background: #0f3460;
      display: block;
    }

    #placeholder {
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      border-radius: 1rem;
      background: #0f3460;
    }

    button {
      margin-top: 1.5rem;
      padding: 0.8rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 2rem;
      background: #e94560;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.5px;
    }

    button:hover {
      background: #c73652;
    }

    button:active {
      transform: scale(0.96);
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
      transform: none;
    }

    #status {
      margin-top: 0.8rem;
      font-size: 0.9rem;
      color: #aaa;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>🐱 Losowanie Kota</h1>
  <div class="card">
    <div id="placeholder">🐱</div>
    <img id="cat-img" src="" alt="Losowy kot" style="display:none;" />
    <button id="btn" onclick="losujKota()">Losuj kota!</button>
    <div id="status"></div>
  </div>

  <script>
    const img = document.getElementById('cat-img');
    const placeholder = document.getElementById('placeholder');
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');

    async function losujKota() {
      btn.disabled = true;
      status.textContent = 'Szukam kota...';

      try {
        const res = await fetch('https://api.thecatapi.com/v1/images/search');
        if (!res.ok) throw new Error('Błąd sieci');
        const [data] = await res.json();

        img.onload = () => {
          placeholder.style.display = 'none';
          img.style.display = 'block';
          status.textContent = 'Oto twój kot! 🎉';
          btn.disabled = false;
        };
        img.onerror = () => {
          status.textContent = 'Nie udało się załadować zdjęcia.';
          btn.disabled = false;
        };
        img.src = data.url;
      } catch (e) {
        status.textContent = 'Błąd: ' + e.message;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
